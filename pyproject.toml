[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toroidal-propeller"
version = "0.1.0"
description = "Reproducible loop-rotor geometry and native OpenFOAM experiments"
requires-python = ">=3.9"
dependencies = ["numpy==2.0.2", "trimesh==4.12.2", "manifold3d==3.5.4", "shapely==2.0.7", "scipy==1.13.1", "networkx==3.2.1", "rtree==1.4.1", "matplotlib==3.9.4"]

[project.scripts]
propeller = "propeller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
